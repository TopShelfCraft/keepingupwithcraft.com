# Site rules for the static export in out/ (`npm run build`).
# Include inside the `keepingupwithcraft.com` server block:

# Next.js exports pages as e.g. `/my-page.html`; serve them at `/my-page`.
# (Check $uri.html first, because the export also creates directories for RSC payloads,
# which would otherwise win and redirect to a trailing-slash URL.)
location / {
    try_files $uri.html $uri $uri/index.html =404;
}

error_page 404 /404.html;